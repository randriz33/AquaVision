<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaVision Pro - Dashboard</title>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 70px;
            height: 100vh;
            background: linear-gradient(180deg, #1a2332 0%, #2563eb 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem 0;
            z-index: 1000;
            transition: width 0.3s ease;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        .sidebar:hover {
            width: 220px;
        }

        .sidebar-logo {
            color: #00d4ff;
            font-size: 2rem;
            margin-bottom: 2rem;
        }

        .sidebar-menu {
            list-style: none;
            width: 100%;
        }

        .sidebar-item {
            width: 100%;
            padding: 1rem 1.2rem;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .sidebar-item:hover {
            background: rgba(0, 212, 255, 0.15);
            color: #00d4ff;
        }

        .sidebar-item.active {
            background: rgba(0, 212, 255, 0.25);
            color: #00d4ff;
            border-left: 4px solid #00d4ff;
        }

        .sidebar-icon {
            min-width: 25px;
        }

        .sidebar-text {
            opacity: 0;
            white-space: nowrap;
            font-weight: 500;
        }

        .sidebar:hover .sidebar-text {
            opacity: 1;
        }

        /* Main Content */
        .main-wrapper {
            margin-left: 70px;
            min-height: 100vh;
        }

        /* Hero Section */
        .hero-section {
            background: linear-gradient(135deg, #1a2332 0%, #2563eb 70%, #00b8d4 100%);
            color: white;
            padding: 2.5rem 2rem;
        }

        .hero-content {
            max-width: 1400px;
            margin: 0 auto;
        }

        .hero-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .hero-title {
            font-size: 2rem;
            font-weight: 300;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .access-buttons {
            display: flex;
            gap: 0.75rem;
        }

        .access-btn {
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
        }

        .btn-admin {
            background: white;
            color: #2563eb;
        }

        .btn-tech {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            backdrop-filter: blur(10px);
        }

        .access-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        /* Live Stats Grid */
        .live-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 1.25rem;
            text-align: center;
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .stat-card:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.18);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #00d4ff;
            margin-bottom: 0.25rem;
        }

        .stat-label {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        /* Main Content Area */
        .content-area {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 1.5rem;
            color: #1a2332;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Cages Grid */
        .cages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .cage-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 2px solid transparent;
        }

        .cage-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.15);
            border-color: #2563eb;
        }

        .cage-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid #f0f0f0;
        }

        .cage-number {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1a2332;
        }

        .cage-status {
            padding: 0.35rem 0.85rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            background: #dcfce7;
            color: #166534;
        }

        .cage-info {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .cage-info-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .cage-info-label {
            color: #666;
        }

        .cage-info-value {
            font-weight: 600;
            color: #1a2332;
        }

        /* Reports Section */
        .reports-section {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .reports-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .report-item {
            background: #f8fafc;
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
            border: 1px solid #e2e8f0;
        }

        .report-item:hover {
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transform: translateX(5px);
        }

        .report-cage {
            font-weight: 700;
            color: #1a2332;
        }

        .report-date {
            color: #666;
            font-size: 0.85rem;
        }

        .report-stats {
            display: flex;
            gap: 1.5rem;
            font-size: 0.85rem;
            color: #666;
        }

        .report-stat strong {
            color: #1a2332;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            max-width: 650px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #e2e8f0;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            color: #1a2332;
        }

        .modal-close {
            background: #f1f5f9;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            padding: 0.5rem;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: #e2e8f0;
        }

        .modal-info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.85rem;
            background: #f8fafc;
            border-radius: 8px;
            margin-bottom: 0.5rem;
        }

        .modal-info-label {
            font-weight: 600;
            color: #64748b;
        }

        .modal-info-value {
            color: #1a2332;
            font-weight: 600;
        }

        /* Loading State */
        .loading-state {
            text-align: center;
            padding: 2rem;
            color: #666;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 0;
                overflow: hidden;
            }

            .main-wrapper {
                margin-left: 0;
            }

            .hero-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .live-stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .cages-grid {
                grid-template-columns: 1fr;
            }

            .report-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }

            .report-stats {
                width: 100%;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <i data-lucide="waves"></i>
        </div>
        <ul class="sidebar-menu">
            <li class="sidebar-item active">
                <i data-lucide="home" class="sidebar-icon"></i>
                <span class="sidebar-text">Accueil</span>
            </li>
            <li class="sidebar-item">
                <i data-lucide="layout-dashboard" class="sidebar-icon"></i>
                <span class="sidebar-text">Dashboard</span>
            </li>
            <li class="sidebar-item">
                <i data-lucide="box" class="sidebar-icon"></i>
                <span class="sidebar-text">Cages</span>
            </li>
            <li class="sidebar-item">
                <i data-lucide="clipboard" class="sidebar-icon"></i>
                <span class="sidebar-text">Rapports</span>
            </li>
            <li class="sidebar-item">
                <i data-lucide="bar-chart-2" class="sidebar-icon"></i>
                <span class="sidebar-text">Analytics</span>
            </li>
        </ul>
    </aside>

    <!-- Main Content -->
    <div class="main-wrapper">
        <!-- Hero Section with Live Stats -->
        <section class="hero-section">
            <div class="hero-content">
                <div class="hero-header">
                    <h1 class="hero-title">
                        <i data-lucide="waves"></i>
                        AquaVision Pro
                    </h1>
                    <div class="access-buttons">
                        <a href="index-supabase.html?role=admin" class="access-btn btn-admin">
                            <i data-lucide="shield"></i>
                            Admin
                        </a>
                        <a href="index-supabase.html?role=tech" class="access-btn btn-tech">
                            <i data-lucide="user-check"></i>
                            Technicien
                        </a>
                    </div>
                </div>

                <div class="live-stats">
                    <div class="stat-card">
                        <div class="stat-value" id="totalCages">-</div>
                        <div class="stat-label">Cages Actives</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalAlive">-</div>
                        <div class="stat-label">Population Totale</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="survivalRate">-</div>
                        <div class="stat-label">Taux de Survie</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalBiomass">-</div>
                        <div class="stat-label">Biomasse Totale</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="avgTemp">-</div>
                        <div class="stat-label">Température Moy.</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="avgWeight">-</div>
                        <div class="stat-label">Poids Moyen</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Content Area -->
        <div class="content-area">
            <!-- Cages Section -->
            <section>
                <div class="section-header">
                    <h2 class="section-title">
                        <i data-lucide="box"></i>
                        Cages Actives
                    </h2>
                </div>
                <div id="cagesContainer" class="cages-grid">
                    <div class="loading-state">
                        <div class="loading-spinner"></div>
                        <p>Chargement...</p>
                    </div>
                </div>
            </section>

            <!-- Reports Section -->
            <section class="reports-section">
                <div class="section-header">
                    <h2 class="section-title">
                        <i data-lucide="clipboard"></i>
                        Rapports Récents
                    </h2>
                </div>
                <div id="reportsContainer" class="reports-list">
                    <div class="loading-state">
                        <div class="loading-spinner"></div>
                        <p>Chargement...</p>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- Modal -->
    <div id="cageModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalCageTitle">Détails de la Cage</h2>
                <button class="modal-close" onclick="closeCageModal()">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div id="modalCageBody"></div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const SUPABASE_URL = 'https://gswozuotdrfgvutitssf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdzd296dW90ZHJmZ3Z1dGl0c3NmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjYzNDA5NzMsImV4cCI6MjA4MTkxNjk3M30.9fivWqGwgVjs6lvKHg-ybWtq1D5EaZ3ZM7Gcz_JZxh0';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadDashboard() {
            await Promise.all([loadStatistics(), loadCages(), loadRecentReports()]);
        }

        async function loadStatistics() {
            try {
                const { data: cages, error } = await db
                    .from('cages')
                    .select('*')
                    .eq('status', 'active');

                if (error) throw error;

                const totalCages = cages.length;
                const totalPopulation = cages.reduce((sum, c) => sum + (c.alive_count || 0), 0);
                const totalBiomass = cages.reduce((sum, c) => sum + (c.current_biomass || 0), 0);
                const totalInitial = cages.reduce((sum, c) => sum + (c.initial_count || 0), 0);
                const survivalRate = totalInitial > 0 ? ((totalPopulation / totalInitial) * 100).toFixed(1) : 0;

                const { data: samples } = await db
                    .from('biometric_samples')
                    .select('weight_grams')
                    .not('weight_grams', 'is', null)
                    .order('created_at', { ascending: false })
                    .limit(100);

                const avgWeight = samples && samples.length > 0
                    ? (samples.reduce((sum, s) => sum + (s.weight_grams || 0), 0) / samples.length).toFixed(0)
                    : 0;

                const { data: reports } = await db
                    .from('daily_reports')
                    .select('water_temp_morning, water_temp_evening')
                    .not('water_temp_morning', 'is', null)
                    .order('report_date', { ascending: false })
                    .limit(10);

                let avgTemp = 0;
                if (reports && reports.length > 0) {
                    const temps = [];
                    reports.forEach(r => {
                        if (r.water_temp_morning) temps.push(r.water_temp_morning);
                        if (r.water_temp_evening) temps.push(r.water_temp_evening);
                    });
                    avgTemp = temps.length > 0 ? (temps.reduce((s, t) => s + t, 0) / temps.length).toFixed(1) : 0;
                }

                document.getElementById('totalCages').textContent = totalCages;
                document.getElementById('totalAlive').textContent = totalPopulation.toLocaleString();
                document.getElementById('survivalRate').textContent = survivalRate + '%';
                document.getElementById('totalBiomass').textContent = totalBiomass.toFixed(0) + ' kg';
                document.getElementById('avgTemp').textContent = avgTemp ? avgTemp + '°C' : 'N/A';
                document.getElementById('avgWeight').textContent = avgWeight ? avgWeight + ' g' : 'N/A';

            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadCages() {
            try {
                const { data: cages, error } = await db
                    .from('cages')
                    .select('*')
                    .eq('status', 'active')
                    .order('cage_number');

                if (error) throw error;

                const container = document.getElementById('cagesContainer');
                if (!cages || cages.length === 0) {
                    container.innerHTML = '<p class="loading-state">Aucune cage active</p>';
                    return;
                }

                container.innerHTML = cages.map(cage => `
                    <div class="cage-card" onclick="openCageModal('${cage.id}')">
                        <div class="cage-header">
                            <div class="cage-number">${cage.cage_number}</div>
                            <span class="cage-status">Actif</span>
                        </div>
                        <div class="cage-info">
                            <div class="cage-info-row">
                                <span class="cage-info-label">Emplacement</span>
                                <span class="cage-info-value">${cage.location || 'N/A'}</span>
                            </div>
                            <div class="cage-info-row">
                                <span class="cage-info-label">Espèce</span>
                                <span class="cage-info-value">${cage.species || 'N/A'}</span>
                            </div>
                            <div class="cage-info-row">
                                <span class="cage-info-label">Population</span>
                                <span class="cage-info-value">${(cage.alive_count || 0).toLocaleString()}</span>
                            </div>
                            <div class="cage-info-row">
                                <span class="cage-info-label">Biomasse</span>
                                <span class="cage-info-value">${(cage.current_biomass || 0).toFixed(1)} kg</span>
                            </div>
                        </div>
                    </div>
                `).join('');

                lucide.createIcons();
            } catch (error) {
                console.error('Error loading cages:', error);
            }
        }

        async function loadRecentReports() {
            try {
                const { data: reports, error } = await db
                    .from('daily_reports')
                    .select('*')
                    .order('report_date', { ascending: false })
                    .limit(10);

                if (error) throw error;

                const container = document.getElementById('reportsContainer');
                if (!reports || reports.length === 0) {
                    container.innerHTML = '<p class="loading-state">Aucun rapport</p>';
                    return;
                }

                const cageIds = [...new Set(reports.map(r => r.cage_id).filter(Boolean))];
                let cagesMap = {};

                if (cageIds.length > 0) {
                    const { data: cages } = await db
                        .from('cages')
                        .select('id, cage_number')
                        .in('id', cageIds);
                    if (cages) cagesMap = Object.fromEntries(cages.map(c => [c.id, c.cage_number]));
                }

                container.innerHTML = reports.map(report => `
                    <div class="report-item">
                        <div>
                            <div class="report-cage">${cagesMap[report.cage_id] || 'N/A'}</div>
                            <div class="report-date">${new Date(report.report_date).toLocaleDateString('fr-FR')}</div>
                        </div>
                        <div class="report-stats">
                            <span>Vivants: <strong>${(report.alive_count || 0).toLocaleString()}</strong></span>
                            <span>Morts: <strong>${report.new_dead || 0}</strong></span>
                            <span>Santé: <strong>${report.health_score || 'N/A'}/10</strong></span>
                        </div>
                    </div>
                `).join('');

                lucide.createIcons();
            } catch (error) {
                console.error('Error loading reports:', error);
            }
        }

        async function openCageModal(cageId) {
            try {
                const { data: cage, error } = await db
                    .from('cages')
                    .select('*')
                    .eq('id', cageId)
                    .single();

                if (error) throw error;

                const { data: reports } = await db
                    .from('daily_reports')
                    .select('*')
                    .eq('cage_id', cageId)
                    .order('report_date', { ascending: false })
                    .limit(5);

                document.getElementById('modalCageTitle').textContent = `Cage ${cage.cage_number}`;

                const survivalRate = cage.initial_count > 0
                    ? ((cage.alive_count / cage.initial_count) * 100).toFixed(1)
                    : 0;

                let html = `
                    <div class="modal-info-row">
                        <span class="modal-info-label">Emplacement</span>
                        <span class="modal-info-value">${cage.location || 'N/A'}</span>
                    </div>
                    <div class="modal-info-row">
                        <span class="modal-info-label">Espèce</span>
                        <span class="modal-info-value">${cage.species || 'N/A'}</span>
                    </div>
                    <div class="modal-info-row">
                        <span class="modal-info-label">Population Initiale</span>
                        <span class="modal-info-value">${(cage.initial_count || 0).toLocaleString()}</span>
                    </div>
                    <div class="modal-info-row">
                        <span class="modal-info-label">Population Actuelle</span>
                        <span class="modal-info-value">${(cage.alive_count || 0).toLocaleString()}</span>
                    </div>
                    <div class="modal-info-row">
                        <span class="modal-info-label">Taux de Survie</span>
                        <span class="modal-info-value">${survivalRate}%</span>
                    </div>
                    <div class="modal-info-row">
                        <span class="modal-info-label">Biomasse</span>
                        <span class="modal-info-value">${(cage.current_biomass || 0).toFixed(1)} kg</span>
                    </div>
                    <div class="modal-info-row">
                        <span class="modal-info-label">Capacité Max</span>
                        <span class="modal-info-value">${cage.max_capacity || 0} kg</span>
                    </div>
                `;

                if (reports && reports.length > 0) {
                    html += `<h3 style="margin-top: 1.5rem; margin-bottom: 1rem; color: #1a2332;">Derniers Rapports</h3>`;
                    reports.forEach(r => {
                        html += `
                            <div class="modal-info-row">
                                <span class="modal-info-label">${new Date(r.report_date).toLocaleDateString('fr-FR')}</span>
                                <span class="modal-info-value">Vivants: ${r.alive_count || 0} | Morts: ${r.new_dead || 0}</span>
                            </div>
                        `;
                    });
                }

                document.getElementById('modalCageBody').innerHTML = html;
                document.getElementById('cageModal').classList.add('active');
                lucide.createIcons();
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function closeCageModal() {
            document.getElementById('cageModal').classList.remove('active');
        }

        document.addEventListener('click', (e) => {
            if (e.target.id === 'cageModal') closeCageModal();
        });

        document.addEventListener('DOMContentLoaded', () => {
            loadDashboard();
            setInterval(loadDashboard, 60000);
        });
    </script>
</body>
</html>
